<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="106.86959999999999 79.52 186.4 224.00000000000003" style="max-height: 500px" width="186.4" height="224.00000000000003">
  <title>NEURO_CORTEX — Icon Only</title>
  <desc>Standalone neural-shield emblem on transparent background, optimized for dark surfaces</desc>

  <defs>
    <filter height="180%" width="180%" y="-40%" x="-40%" id="glow">
      <feGaussianBlur result="blur" stdDeviation="3.5"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter height="220%" width="220%" y="-60%" x="-60%" id="glowSoft">
      <feGaussianBlur result="blur" stdDeviation="8"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter height="260%" width="260%" y="-80%" x="-80%" id="glowStrong">
      <feGaussianBlur result="blur" stdDeviation="16"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  

  
